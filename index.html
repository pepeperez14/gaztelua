:root{--bg:#f3e9d2;--card:#fffaf0;--ink:#2a1d14;--mut:#6d5b4b;--line:#e2d4b6;--red:#8e1b1b;--red2:#b3261e;--gold:#c99a2e;--gold2:#f2d27a;--ok:#2e7d32;--okb:#e3f2dc;--bad:#c62828;--badb:#fbe3e1;--warn:#a86a00;--warnb:#fff1cc;--blue:#1f3a93;--sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sa-r:env(safe-area-inset-right,0px);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'IN',system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%;background-image:radial-gradient(circle at 20% 0%,#f8f0dc 0,transparent 60%),radial-gradient(circle at 100% 100%,#ecdcb8 0,transparent 50%);min-height:100vh}
body:not(.es) .L.es,body.es .L.eu{display:none!important}
h1,h2,h3,h4{font-family:'CZ','IN',serif;font-weight:700;line-height:1.2;margin:0 0 8px;text-wrap:balance;letter-spacing:.01em}
h1{font-size:28px}h2{font-size:22px}h3{font-size:19px}h4{font-size:18px;margin-top:14px;color:var(--red)}
button{font:inherit;color:inherit;cursor:pointer}
.small{font-size:15px}.muted{color:var(--mut)}
main{max-width:1180px;margin:0 auto;padding:14px max(16px,var(--sa-r)) calc(60px + var(--sa-b)) max(16px,var(--sa-l))}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sa-t)) max(14px,var(--sa-r)) 8px max(14px,var(--sa-l));background:var(--red);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:4px;min-height:44px}
.logo i{width:38px;height:38px;border-radius:10px;background:var(--gold2);color:var(--red);display:grid;place-items:center;font-style:normal;font-size:22px}
.logo b{font-family:'CZ',serif;font-size:20px;letter-spacing:.04em}
.sp{flex:1}
.chip{background:rgba(255,255,255,.16);border-radius:20px;padding:5px 11px;font-size:15px;font-weight:700;white-space:nowrap}
.tbtn{background:rgba(255,255,255,.16);border:0;border-radius:12px;color:#fff;padding:8px 12px;min-height:44px;font-weight:700;font-size:16px}
.tbtn.lang{background:var(--gold2);color:var(--red);min-width:52px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 0 rgba(0,0,0,.04);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;min-height:50px;font-weight:700;font-size:18px;background:#efe3c8;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--red);color:#fff}
.btn.big{width:100%;min-height:62px;font-size:21px}
.btn.ok{background:var(--ok);color:#fff}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.sm{min-height:42px;padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* inicio */
.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,#fffaf0,#f6e7c3)}
.count{background:var(--red);color:#fff;border-radius:16px;padding:10px 16px;text-align:center;min-width:120px}
.count b{display:block;font-family:'CZ',serif;font-size:34px;line-height:1}
.plan h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pbar{height:12px;background:#eadcbc;border-radius:8px;overflow:hidden;margin:8px 0 12px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:8px;transition:width .4s}
ol.tasks{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.task{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:#fbf4e3;border:2px solid transparent}
.task .n{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e8d8b4;font-weight:800}
.task.now{border-color:var(--red);background:#fff}
.task.now .n{background:var(--red);color:#fff}
.task.done{opacity:.7}.task.done .tt{text-decoration:line-through}
.task.done .n{background:var(--ok);color:#fff}
.task .tt{font-weight:700}.task .ts{font-size:14px;color:var(--mut)}
.task .tg{font-size:14px;font-weight:700;color:var(--ok);white-space:nowrap}
.lab{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.warnline{background:var(--warnb);border-radius:12px;padding:10px 12px;margin:10px 0 0}
.sec-h{margin:22px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:96px}
.tile .ti{font-size:24px}.tile b{font-size:17px}.tile span{font-size:14px;color:var(--mut)}
.tile.red{background:#fbe6e2}.tile.dark{background:var(--red);color:#fff}.tile.dark span{color:#f6d9d4}.tile.gold{background:#fbefc8}
/* destrezas */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.skc{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.skc.dom{border-color:var(--ok);background:#f3faef}
.skc .ic{width:48px;height:48px;flex:none;border-radius:12px;background:#f1e2bd;display:grid;place-items:center;font-weight:800;font-size:16px}
.ladder{display:flex;gap:4px;margin:6px 0}.ladder i{flex:1;height:8px;border-radius:4px;background:#e8dcc0}.ladder i.on{background:var(--gold)}.ladder i.dom{background:var(--ok)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin-bottom:8px;gap:8px}
/* ejercicio */
.exhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.exhead .info{flex:1;min-width:0}.exhead .t1{font-weight:800;font-size:16px;color:var(--red)}.exhead .t2{font-size:14px;color:var(--mut)}
.xbtn{border:2px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:6px 14px;font-weight:700}
.exgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){.exgrid.two{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}.exgrid.two .bdcol{position:sticky;top:76px;align-self:start}}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.lvl{display:inline-block;font-size:13px;font-weight:800;border-radius:20px;padding:3px 10px;color:#fff;background:var(--mut)}
.lvl.l1{background:#2e7d32}.lvl.l2{background:#1f3a93}.lvl.l3{background:#b36b00}.lvl.l4{background:var(--bad)}
.ins{font-weight:700;margin:10px 0 6px;font-size:19px}
.prompt{font-size:21px;line-height:1.45;background:#fbf4e3;border-left:5px solid var(--gold);border-radius:10px;padding:12px 14px;margin:6px 0 12px}
.hint{font-size:15px;color:var(--mut);margin:4px 0}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;min-height:52px;font-size:18px}
.opt.on{border-color:var(--blue);background:#eef2fb}
.opt.good{border-color:var(--ok);background:var(--okb)}.opt.wrong{border-color:var(--bad);background:var(--badb)}
.tf3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tf3 .opt{text-align:center;font-weight:800;font-size:20px}
input.ans,textarea.ans{width:100%;font:inherit;font-size:21px;padding:12px 14px;border:2px solid #cdb98f;border-radius:12px;background:#fff;color:var(--ink)}
textarea.ans{min-height:170px;line-height:1.5;resize:vertical}
input.ans:focus,textarea.ans:focus{outline:3px solid #f2d27a;border-color:var(--gold)}
input.ans.okf,textarea.ans.okf{border-color:var(--ok);background:#f4fbf1}input.ans.badf{border-color:var(--bad);background:#fff6f5}input.ans.form{border-color:var(--warn);background:#fffaf0}
.ansblock{background:#fbf4e3;border-radius:14px;padding:12px;margin-top:8px}
.ansblock .btn{margin-top:10px}
.lines{display:grid;gap:8px}
.lines .li{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.lines .li b{text-align:right;color:var(--mut)}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.bank button{border:2px dashed #cdb98f;background:#fff;border-radius:20px;padding:6px 12px;font-size:16px;min-height:40px}
.bank button.used{opacity:.35}
.dgwrap{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;overflow-x:auto}
.dg{width:100%;height:auto;display:block;min-width:520px}
.dg .lt{font-weight:700;fill:var(--ink)}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:10px}
.labgrid .li{display:grid;grid-template-columns:36px 1fr;gap:6px;align-items:center}
.labgrid .li b{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:15px}
.labgrid input.ans{font-size:18px;padding:8px 10px}
.sortlist{display:grid;gap:8px}
.sitem{display:grid;grid-template-columns:1fr;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.sitem .row button{flex:1;min-width:110px;border:2px solid var(--line);background:#fbf4e3;border-radius:10px;padding:8px;font-size:15px;font-weight:700;min-height:44px}
.sitem .row button.on{border-color:var(--blue);background:#eef2fb}
.sitem.good{border-color:var(--ok);background:#f4fbf1}.sitem.wrong{border-color:var(--bad);background:#fff6f5}
.seq{display:grid;gap:8px;margin:8px 0}
.seq button{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:17px;min-height:48px}
.seq button .k{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#e8d8b4;font-weight:800;margin-right:8px;font-size:14px}
.seq button.picked{opacity:.4}
.seq.res button{cursor:default}
.words{display:flex;flex-wrap:wrap;gap:6px;font-size:21px;line-height:1.4;margin:8px 0}
.words button{border:2px solid transparent;background:#fbf4e3;border-radius:8px;padding:4px 8px;font-size:20px}
.words button.on{border-color:var(--bad);background:var(--badb)}.words button.good{border-color:var(--ok);background:var(--okb)}
.fb{border-radius:16px;padding:14px 16px;margin-top:12px}
.fb.ok{background:var(--okb)}.fb.bad{background:var(--badb)}.fb.form{background:var(--warnb)}
.fb h3{margin:0 0 6px;font-family:'IN',sans-serif;font-size:20px}
.fb .model{background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;border-left:5px solid var(--ok)}
.keys{list-style:none;padding:0;margin:6px 0;display:grid;gap:4px}
.keys li{font-size:16px}.keys li.y::before{content:'✓ ';color:var(--ok);font-weight:800}.keys li.n::before{content:'✗ ';color:var(--bad);font-weight:800}
.real{background:#fff;border-left:5px solid var(--gold);padding:8px 10px;border-radius:8px;margin-top:8px;font-size:15px}
.coinpop{display:inline-block;margin-left:8px;color:var(--gold);font-weight:800;animation:pop .6s}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.nextbtn{margin-top:12px}
.imgq{max-width:100%;border-radius:12px;display:block;margin:6px auto;max-height:340px}
/* pizarra */
.bdcol .card{padding:12px}
.bd-tools{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.bd-c,.bd-a{border:2px solid var(--line);background:#fff;border-radius:10px;min-width:44px;min-height:44px;display:grid;place-items:center;font-size:15px;font-weight:700;padding:0 8px}
.bd-c i{width:22px;height:22px;border-radius:50%;display:block}
.bd-c svg{width:22px;height:22px}
.bd-c.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.bd-sp{flex:1}
.bd-sheet{border:1px solid #d9c9a6;border-radius:12px;overflow:hidden;background:#fffdf6}
.bd-head{padding:10px 14px;font-size:17px;line-height:1.4;background:#fbf1d9;border-bottom:2px dashed #d9c39a;color:#3a2a1c;user-select:none;-webkit-user-select:none}
.bd-head b{color:var(--red)}
.bd-wrap{position:relative;--bdh:440px;background-image:linear-gradient(#efe3c9 1px,transparent 1px);background-size:100% 34px}
.bdcol{--bdh:440px}
@media (max-width:899px){.bdcol{--bdh:300px}}
.bd-cv{display:block;width:100%;touch-action:none}
.bd-ph{position:absolute;inset:0;display:grid;place-items:center;color:#b8a888;font-size:18px;pointer-events:none}
/* teoría */
.thnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.thnav button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:15px;font-weight:700;min-height:42px}
.thnav button.on{background:var(--red);color:#fff;border-color:var(--red)}
.thnav button.rd::after{content:' ✓';color:var(--ok)}
.th .def{background:#fbf1d9;border-left:5px solid var(--red);border-radius:10px;padding:10px 14px;margin:8px 0}
.th .tip{background:#eef6e6;border-radius:12px;padding:10px 14px;margin:10px 0}
.th .warn{background:var(--badb);border-radius:12px;padding:10px 14px;margin:10px 0}
.th .lead{font-size:20px;font-weight:600}
.th .two{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.th .two{grid-template-columns:1fr 1fr}}
.th .box{background:#fbf4e3;border-radius:12px;padding:10px 12px}
.th ol.chain li{margin-bottom:6px}
.th .fig{margin:10px 0;text-align:center}
.th .fig img{max-width:100%;border-radius:12px;max-height:360px}
.th .fig.small img{max-height:280px}
.th .fig .cap{display:block;font-size:14px;color:var(--mut);margin-top:4px}
.th .fig .dg{min-width:0}
.uses{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:760px){.uses{grid-template-columns:1fr 1fr}}
.use{background:#fbf4e3;border-radius:14px;padding:12px 14px}.use p{margin:6px 0}.use .ex{color:var(--blue);font-weight:600}
table.tt{border-collapse:collapse;width:100%;margin:10px 0;font-size:16px}
.tt th,.tt td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tt th{background:var(--red);color:#fff}
.tblwrap{overflow-x:auto}
.glos td:first-child{font-weight:700}
ul.chk{list-style:none;padding:0}ul.chk li::before{content:'☐ ';color:var(--red);font-weight:800}
/* examen */
.exbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:10px;position:sticky;top:64px;z-index:10}
.timer{font-family:'CZ',serif;font-size:28px;font-weight:800;min-width:96px;color:var(--red)}
.timer.low{color:#fff;background:var(--bad);border-radius:10px;padding:0 8px}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qnav button{min-width:52px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800}
.qnav button.cur{border-color:var(--red);background:var(--red);color:#fff}.qnav button.ans{background:#e9f4e3}
.qnav button.cur.ans{background:var(--red)}
.part{border-top:2px dashed var(--line);margin-top:14px;padding-top:12px}
.grade{font-family:'CZ',serif;font-size:56px;font-weight:800;color:var(--red);line-height:1}
.grade small{font-size:24px;color:var(--mut)}
.restab{width:100%;border-collapse:collapse}.restab td,.restab th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tagok{color:var(--ok);font-weight:800}.tagbad{color:var(--bad);font-weight:800}.tagbl{color:var(--warn);font-weight:800}
details.res{border-bottom:1px solid var(--line);padding:8px 0}details.res summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;gap:6px}
/* insignias, familia, modales */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;opacity:.45}
.badge.got{opacity:1;border-color:var(--gold);background:#fff8e1}.badge i{display:block;font-size:34px;font-style:normal}.badge b{display:block}.badge span{font-size:13px;color:var(--mut)}
.fam input[type=text],.fam input[type=date]{font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;min-height:48px}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:10px}
.bars div{flex:1;background:var(--gold);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.inkthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.inkthumbs figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.inkthumbs canvas{width:100%;border:1px solid var(--line);border-radius:8px}
.pend{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.pend .mine{white-space:pre-wrap;background:#fbf4e3;border-radius:8px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sa-b));transform:translateX(-50%) translateY(150%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;transition:transform .3s;max-width:92vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(30,20,10,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:620px;width:100%;max-height:90vh;overflow:auto}
@media (max-width:600px){h1{font-size:23px}.logo b{display:none}.prompt{font-size:19px}.tf3 .opt{font-size:17px}.chip{padding:4px 8px;font-size:13px}.tbtn{padding:6px 9px;font-size:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

{ id: 'zertarako', ic: '💡', t: { eu: 'Zertarako balio du hau ikasteak?', es: '¿Para qué sirve esto?' },
  eu: `<p class="lead">Erdi Aroa ez dago urrun: zure hirian, zure hitzetan eta zure bideojokoetan dago.</p>
<div class="uses">
<div class="use"><b>⛪ Gasteizko eliza erromanikoak</b><p><b>Armentiako San Prudentzio basilika</b> (Gasteiz, XII. mendea) eta <b>Estibalizko santutegia</b> (Gasteiztik 10 km-ra, XII. mendea) erromanikoak dira. Estibalizek <b>hiru abside</b> ditu eta Armentiak abside erdi-zirkularra eta timpano bat (Bildotsa eta Salbatzailea).</p><p class="ex">→ Ikasten dituzun zatiak (absidea, kanoi-ganga, kontrahormak) zure hirian bertan ikus ditzakezu.</p></div>
<div class="use"><b>⚖️ Legea berdina denontzat?</b><p>Gizarte feudalean legea eta justizia <b>ez ziren berdinak</b> denentzat: jaiotzak erabakitzen zuen zure estamentua. Gaur, Espainiako Konstituzioaren <b>14. artikuluak</b> dio legearen aurrean denok berdinak garela, «jaiotzagatik» bereizketarik egin gabe.</p><p class="ex">→ Pribilegioak ulertzeak gaur dugun berdintasunaren balioa ulertzen laguntzen du.</p></div>
<div class="use"><b>🎮 Bideojokoak</b><p><i>Crusader Kings III</i> jokoan zure <b>basailuek</b> zergak eta soldaduak ematen dizkizute «kontratu feudal» baten truke, eta haiek pozik ez badaude, matxinatu egiten dira.</p><p class="ex">→ Hori da basailutza: leialtasuna eta laguntza militarra, feudoaren truke.</p></div>
<div class="use"><b>🌾 Gaurko nekazaritza eta hitzak</b><p>Nekazariek gaur ere <b>laboreak txandakatzen</b> dituzte eta lurra <b>lugorrian</b> uzten dute, lurra ez agortzeko. Eta gaztelaniaz «vasallo», «feudo» («es su feudo») edo «diezmo» esaten dugu oraindik.</p><p class="ex">→ Erdi Aroko teknikak eta hitzak gaur bizirik daude.</p></div>
</div>`,
  es: `<p class="lead">La Edad Media no está lejos: está en tu ciudad, en tus palabras y en tus videojuegos.</p>
<div class="uses">
<div class="use"><b>⛪ Iglesias románicas en Vitoria-Gasteiz</b><p>La <b>basílica de San Prudencio de Armentia</b> (Vitoria-Gasteiz, siglo XII) y el <b>santuario de Estíbaliz</b> (a 10 km de Vitoria, siglo XII) son románicos. Estíbaliz tiene <b>tres ábsides</b> y Armentia un ábside semicircular y un tímpano (el Cordero y el Salvador).</p><p class="ex">→ Las partes que estudias (ábside, bóveda de cañón, contrafuertes) las puedes ver en tu propia ciudad.</p></div>
<div class="use"><b>⚖️ ¿La ley igual para todos?</b><p>En la sociedad feudal la ley y la justicia <b>no eran iguales</b> para todos: el nacimiento decidía tu estamento. Hoy, el <b>artículo 14</b> de la Constitución española dice que todos somos iguales ante la ley, sin discriminación «por razón de nacimiento».</p><p class="ex">→ Entender los privilegios ayuda a valorar la igualdad que tenemos hoy.</p></div>
<div class="use"><b>🎮 Videojuegos</b><p>En <i>Crusader Kings III</i> tus <b>vasallos</b> te dan impuestos y soldados a cambio de un «contrato feudal», y si no están contentos, se rebelan.</p><p class="ex">→ Eso es el vasallaje: fidelidad y ayuda militar a cambio del feudo.</p></div>
<div class="use"><b>🌾 La agricultura y las palabras de hoy</b><p>Los agricultores todavía <b>rotan los cultivos</b> y dejan la tierra en <b>barbecho</b> para que no se agote. Y en castellano seguimos diciendo «vasallo», «feudo» («es su feudo») o «diezmo».</p><p class="ex">→ Técnicas y palabras medievales siguen vivas.</p></div>
</div>` },

{ id: 'feudalismoa', ic: '🏰', t: { eu: '1. Feudalismoa: zer zen eta nola sortu zen', es: '1. El feudalismo: qué era y cómo surgió' },
  eu: `<div class="def"><b>Feudalismoa</b>: X. mendetik aurrera Europan hedatu zen <b>gizartea antolatzeko eta gobernatzeko modu berria</b>. Gizarte-taldeen arteko <b>mendekotasun-harremanetan</b> oinarritzen zen.</div>
<h4>Nola sortu zen? (kausa → ondorioa)</h4>
<ol class="chain"><li><b>Inbasioen bigarren bolada</b> (IX.–X. mendeak): <b>bikingoak</b> (iparraldetik), <b>musulmanak</b> (hegoaldetik, Mediterraneotik) eta <b>magiarrak</b> (ekialdetik).</li>
<li>Erasoak gero eta bortitzagoak: lapurretak, herrixken suntsiketak, zubi- eta bide-mozketak → <b>Europa hondatu eta zatikatu</b> zen eta <b>beldurra</b> zabaldu zen.</li>
<li><b>Monarkek</b> ezin izan zioten egoerari aurre egin → <b>boterearen zati bat nobleei</b> eman zieten, lurraldea defendatu eta gobernatzeko.</li>
<li><b>Nobleek</b> armada pribatuak antolatu zituzten eta <b>monarkaren basailu</b> bihurtu ziren.</li>
<li>Leialtasunaren eta laguntza militarraren truke, nobleek lurralde bat jaso zuten (<b>feudoa</b>) eta <b>jaun feudal</b> bihurtu ziren.</li>
<li><b>Nekazariek</b> babes bila nobleengana jo zuten → <b>jopu</b> bihurtu ziren.</li></ol>
<h4>Piramide feudala</h4><div class="fig" data-svg="hierarkia"></div>
<p>Goitik behera: <b>babestu eta feudo bat ematen du</b>. Behetik gora: <b>zerbitzatu eta aholku ematen du</b>. Jaun baten basailuak ere jaun izan zitezkeen.</p>
<div class="tip"><b>Trikimailua · I-H-E</b>: bikingoak <b>I</b>paretik, musulmanak <b>H</b>egoaldetik, magiarrak <b>E</b>kialdetik.</div>`,
  es: `<div class="def"><b>Feudalismo</b> (feudalismoa): desde el siglo X se extendió por Europa una <b>nueva forma de organizar y gobernar la sociedad</b>. Se basaba en <b>relaciones de dependencia</b> entre grupos sociales.</div>
<h4>¿Cómo surgió? (causa → consecuencia)</h4>
<ol class="chain"><li><b>Segunda oleada de invasiones</b> (siglos IX–X): <b>vikingos</b> (desde el norte), <b>musulmanes</b> (desde el sur, el Mediterráneo) y <b>magiares</b> (desde el este).</li>
<li>Ataques cada vez más violentos: saqueos, destrucción de aldeas, cortes de puentes y caminos → <b>Europa se arruinó y se fragmentó</b> y se extendió el <b>miedo</b>.</li>
<li>Los <b>monarcas</b> no pudieron hacer frente → dieron <b>parte de su poder a los nobles</b> para defender y gobernar el territorio.</li>
<li>Los <b>nobles</b> organizaron ejércitos privados y se hicieron <b>vasallos del monarca</b>.</li>
<li>A cambio de fidelidad y ayuda militar, los nobles recibieron un territorio (<b>feudo</b>) y se convirtieron en <b>señores feudales</b>.</li>
<li>Los <b>campesinos</b> buscaron protección en los nobles → se convirtieron en <b>siervos</b>.</li></ol>
<h4>Pirámide feudal</h4><div class="fig" data-svg="hierarkia"></div>
<p>De arriba abajo: <b>protege y da un feudo</b>. De abajo arriba: <b>sirve y da consejo</b>. Los vasallos de un señor también podían ser señores.</p>
<div class="tip"><b>Truco · I-H-E</b> (Ipar, Hego, Ekialde = norte, sur, este): vikingos del norte, musulmanes del sur, magiares del este.</div>` },

{ id: 'basailutza', ic: '🤝', t: { eu: '2. Basailutza eta joputza', es: '2. Vasallaje y servidumbre' },
  eu: `<div class="def"><b>Basailutza</b>: monarkaren eta nobleen artean, edo maila desberdineko nobleen artean, adostutako <b>leialtasun-ituna</b>. Jaunak (maila gorenekoa) maila beherenekoa bere <b>babespean</b> hartzen zuen, <b>basailu bihurtuz</b>. Noble asko jaun feudal bilakatu ziren eta kargua <b>ondorengoei oinordetzan</b> uzten hasi ziren.</div>
<h4>Zeremoniaren bi zatiak</h4><div class="two"><div class="box"><b>1. Jauspena</b><br>Basailuak, jaunaren aurrean <b>belaunikoz</b>, <b>leialtasuna, gobernurako aholkua eta laguntza militarra</b> agintzen zizkion.</div><div class="box"><b>2. Inbestidura</b><br>Jaunak <b>feudoa</b> ematen zion basailuari, <b>gobernatzeko eta ekonomikoki ustiatzeko</b>.</div></div>
<div class="fig"><img data-img="homenaje" alt="Basailutza-zeremonia (miniatura, XII. mendea)"><span class="cap">Basailutza-zeremonia: basailua belaunikoz, eskuak jaunaren eskuen artean.</span></div>
<div class="def"><b>Joputza</b>: inbasioen ondorioz <b>nekazariek ez zuten segurtasunik</b> eta nobleengana jo zuten babes bila (gazteluak eta armadak zituzten). Nobleek <b>babesa eta lur zati bat</b> ematen zieten lantzeko. Nekazariek <b>askatasuna galdu</b> eta <b>jopu</b> bihurtzen ziren: <b>uztaren zati bat</b> jaunari eman behar zioten eta haren <b>justiziaren mende</b> geratzen ziren.</div>
<table class="tt"><tr><th></th><th>Basailutza</th><th>Joputza</th></tr>
<tr><td>Nor?</td><td>Monarka ↔ noblea, edo noble ↔ noble</td><td>Jauna (noblea) ↔ nekazaria</td></tr>
<tr><td>Behekoak ematen du</td><td>Leialtasuna, aholkua, laguntza militarra</td><td>Uztaren zati bat, lana; askatasuna galtzen du</td></tr>
<tr><td>Goikoak ematen du</td><td>Babesa eta feudoa</td><td>Babesa eta lur zati bat</td></tr>
<tr><td>Zeremonia</td><td>Jauspena + inbestidura</td><td>—</td></tr></table>
<div class="tip"><b>Trikimailua</b>: lehenengo <b>J</b>auspena: basailua <b>j</b>aitsi egiten da (belaunikoz) eta hitza ematen du. Gero <b>I</b>nbestidura: feudoa jasotzen du. Ordena: <b>J → I</b> («<b>J</b>aitsi eta <b>I</b>rabazi»).</div>`,
  es: `<div class="def"><b>Vasallaje</b> (basailutza): <b>pacto de fidelidad</b> entre el monarca y los nobles, o entre nobles de distinto rango. El señor (rango superior) tomaba bajo su <b>protección</b> al de rango inferior, <b>haciéndolo vasallo</b>. Muchos nobles se convirtieron en señores feudales y empezaron a dejar el cargo <b>en herencia a sus descendientes</b>.</div>
<h4>Las dos partes de la ceremonia</h4><div class="two"><div class="box"><b>1. Homenaje</b> (jauspena)<br>El vasallo, <b>de rodillas</b> ante el señor, le prometía <b>fidelidad, consejo para gobernar y ayuda militar</b>.</div><div class="box"><b>2. Investidura</b> (inbestidura)<br>El señor daba el <b>feudo</b> al vasallo, <b>para gobernarlo y explotarlo económicamente</b>.</div></div>
<div class="fig"><img data-img="homenaje" alt="Ceremonia de vasallaje (miniatura, siglo XII)"><span class="cap">Ceremonia de vasallaje: el vasallo de rodillas, con las manos entre las del señor.</span></div>
<div class="def"><b>Servidumbre</b> (joputza): por las invasiones <b>los campesinos no tenían seguridad</b> y buscaron protección en los nobles (tenían castillos y ejércitos). Los nobles les daban <b>protección y un trozo de tierra</b> para cultivar. Los campesinos <b>perdían su libertad</b> y se convertían en <b>siervos</b>: debían dar <b>parte de la cosecha</b> al señor y quedaban bajo su <b>justicia</b>.</div>
<table class="tt"><tr><th></th><th>Vasallaje</th><th>Servidumbre</th></tr>
<tr><td>¿Quiénes?</td><td>Monarca ↔ noble, o noble ↔ noble</td><td>Señor (noble) ↔ campesino</td></tr>
<tr><td>El de abajo da</td><td>Fidelidad, consejo, ayuda militar</td><td>Parte de la cosecha, trabajo; pierde la libertad</td></tr>
<tr><td>El de arriba da</td><td>Protección y feudo</td><td>Protección y un trozo de tierra</td></tr>
<tr><td>Ceremonia</td><td>Homenaje + investidura</td><td>—</td></tr></table>
<div class="tip"><b>Truco</b>: primero el <b>J</b>auspena (homenaje): el vasallo <b>j</b>aitsi (se baja, de rodillas) y da su palabra. Después la <b>I</b>nbestidura: recibe el feudo. Orden: <b>J → I</b> («<b>J</b>aitsi eta <b>I</b>rabazi»: bajarse y ganar).</div>` },

{ id: 'gizartea', ic: '🔺', t: { eu: '3. Gizarte feudala: estamentuak', es: '3. La sociedad feudal: los estamentos' },
  eu: `<div class="def">Gizartea <b>estamentuetan antolatuta</b> zegoen eta bakoitza <b>talde itxi</b> bat zen: pertsona bat <b>jaiotzez</b> estamentu batekoa zen eta <b>bizitza osorako</b>. <b>Legea eta justizia ez ziren berdinak denentzat.</b></div>
<div class="warn">⚠️ Zure apunteetan «ez ziren <b>desberdinak</b>» idatzi zenuen: alderantziz da. Legea <b>ez zen berdina</b> denentzat.</div>
<div class="fig" data-svg="piramidea"></div>
<table class="tt"><tr><th>Pribilegiatuak</th><th>Ez-pribilegiatuak</th></tr>
<tr><td><b>Monarka, noblezia eta kleroa</b>. Biztanleriaren gutxiengoa.</td><td><b>Nekazariak, artisauak, merkatariak…</b> Hirugarren estamentua (hirugarren estatua).</td></tr>
<tr><td><b>Eskubide guztiak</b>:<br>• Lur gehienak zituzten<br>• Ez zuten lan egiten: lurren errentetatik bizi ziren<br>• Ez zuten zergarik ordaintzen<br>• Erresumako goi-karguak betetzen zituzten</td><td><b>Betebeharrak</b>:<br>• Lan egitea<br>• Beste bi estamentuak mantentzea<br>• Zerga handiak ordaintzea<br><b>Ez zuten eskubiderik.</b> Lanaren arabera bereizten ziren.</td></tr></table>
<div class="tip"><b>Trikimailuak</b>: pribilegiatuen eskubideak = <b>LU-LA-ZE-KA</b> (LUrrak, LAnik ez, ZErgarik ez, KArguak). Ez-pribilegiatuen betebeharrak = <b>LA-MA-ZE</b> (LAna, MAntendu, ZErgak).</div>`,
  es: `<div class="def">La sociedad estaba <b>organizada en estamentos</b> y cada uno era un <b>grupo cerrado</b>: una persona pertenecía a un estamento <b>por nacimiento</b> y <b>para toda la vida</b>. <b>La ley y la justicia no eran iguales para todos.</b></div>
<div class="warn">⚠️ En tus apuntes escribiste «ez ziren <b>desberdinak</b>» (no eran diferentes): es al revés. La ley <b>no era igual</b> para todos.</div>
<div class="fig" data-svg="piramidea"></div>
<table class="tt"><tr><th>Privilegiados (pribilegiatuak)</th><th>No privilegiados (ez-pribilegiatuak)</th></tr>
<tr><td><b>Monarca, nobleza y clero</b>. La minoría de la población.</td><td><b>Campesinos, artesanos, mercaderes…</b> El tercer estado.</td></tr>
<tr><td><b>Todos los derechos</b>:<br>• Tenían la mayoría de las tierras<br>• No trabajaban: vivían de las rentas de las tierras<br>• No pagaban impuestos<br>• Ocupaban los altos cargos del reino</td><td><b>Obligaciones</b>:<br>• Trabajar<br>• Mantener a los otros dos estamentos<br>• Pagar grandes impuestos<br><b>No tenían ningún derecho.</b> Se distinguían por su trabajo.</td></tr></table>
<div class="tip"><b>Trucos</b>: derechos de los privilegiados = <b>LU-LA-ZE-KA</b> (LUrrak tierras, LAnik ez no trabajan, ZErgarik ez sin impuestos, KArguak cargos). Obligaciones de los no privilegiados = <b>LA-MA-ZE</b> (LAna trabajo, MAntendu mantener, ZErgak impuestos).</div>` },

{ id: 'monarkia', ic: '👑', t: { eu: '4. Monarkia eta noblezia', es: '4. Monarquía y nobleza' },
  eu: `<div class="two"><div><h4>Monarkia</h4><ul><li>Monarkak <b>izaera sakratua</b> zuen: <b>Jainkoak hautatua</b> zela uste zen, Lurrean gizartea antolatzeko eta <b>kristautasuna defendatzeko</b>.</li>
<li>Haren agintepeko lurraldeek <b>erresuma</b> osatzen zuten; nahi zuen moduan zatitu edo elkartu zitzakeen.</li>
<li><b>Noblezia eta kleroarekin batera</b> gobernatzen zuen, <b>Errege Kontseiluaren</b> laguntzarekin.</li></ul>
<b>Eskumenak (3)</b>: <b>kanpaina militarrak gidatzea</b> · <b>zergak biltzea</b> · <b>epaile gorena</b> izatea auzietan.</div>
<div class="fig small"><img data-img="erregea" alt="Errege bat koroa eta zetroarekin (miniatura)"><span class="cap">Erregea: koroa eta zetroa, botere sakratuaren ikurrak.</span></div></div>
<h4>Noblezia</h4><ul><li>Feudoetako errentei eta basailutza-itunei esker, <b>jabetzak eta boterea handitu</b> zituzten.</li>
<li><b>Gizartea armen bidez babesteko eginkizuna</b>: <b>gerrarako trebatu</b> behar ziren; monarkak deitzean, beren <b>osteekin</b> (gizon armatuak) joan behar zuten.</li>
<li><b>Eguneroko zereginak</b>: feudoa kontrolatu, basailuak hartu, justizia administratu, zergak eta janaria bildu, guardia-postuak egin.</li>
<li><b>Aisialdia</b>: <b>oturuntzak</b> (festak) eta <b>ehiza</b>.</li>
<li><b>Damak</b>: <b>leinua betikotzea</b> eta <b>seme-alaben heziketa</b>. Senarra hiltzean, emazteak lurren eta jauregiaren ardura hartzen zuen.</li></ul>
<div class="tip"><b>Trikimailua · K-Z-E</b>: erregearen eskumenak = <b>K</b>anpainak, <b>Z</b>ergak, <b>E</b>paile gorena.</div>`,
  es: `<div class="two"><div><h4>Monarquía</h4><ul><li>El monarca tenía <b>carácter sagrado</b>: se creía que era <b>elegido por Dios</b> para organizar la sociedad en la Tierra y <b>defender el cristianismo</b>.</li>
<li>Los territorios bajo su mando formaban el <b>reino</b>; podía dividirlos o unirlos como quisiera.</li>
<li>Gobernaba <b>junto con la nobleza y el clero</b>, con ayuda del <b>Consejo Real</b>.</li></ul>
<b>Competencias (3)</b>: <b>dirigir las campañas militares</b> · <b>recaudar impuestos</b> · ser el <b>juez supremo</b> en los juicios.</div>
<div class="fig small"><img data-img="erregea" alt="Un rey con corona y cetro (miniatura)"><span class="cap">El rey: corona y cetro, símbolos del poder sagrado.</span></div></div>
<h4>Nobleza</h4><ul><li>Gracias a las rentas de los feudos y a los pactos de vasallaje, <b>aumentaron sus propiedades y su poder</b>.</li>
<li><b>Función de proteger a la sociedad con las armas</b>: debían <b>entrenarse para la guerra</b>; cuando el monarca les llamaba, acudían con sus <b>huestes</b> (hombres armados).</li>
<li><b>Tareas diarias</b>: controlar el feudo, recibir vasallos, administrar justicia, recaudar impuestos y alimentos, hacer guardias.</li>
<li><b>Ocio</b>: <b>banquetes</b> (fiestas) y <b>caza</b>.</li>
<li><b>Las damas</b>: <b>perpetuar el linaje</b> y la <b>educación de los hijos</b>. Al morir el marido, la esposa se encargaba de las tierras y del palacio.</li></ul>
<div class="tip"><b>Truco · K-Z-E</b>: competencias del rey = <b>K</b>anpainak (campañas), <b>Z</b>ergak (impuestos), <b>E</b>paile gorena (juez supremo).</div>` },

{ id: 'kleroa', ic: '⛪', t: { eu: '5. Kleroa', es: '5. El clero' },
  eu: `<ul><li>Europako biztanle gehienak <b>kristauak</b> zirenez, kleroak fededunen <b>espiritualtasuna gidatzen</b> zuen eta <b>komunitatearen bizitza antolatzen</b> zuen.</li>
<li>Kleroa <b>bere bizitza Elizari eskaintzen</b> zioten pertsonek osatzen zuten. <b>Hierarkiaren</b> gailurrean <b>aita santua</b> zegoen (Erroman).</li></ul>
<table class="tt"><tr><th>Arduraren arabera</th><th>Bizi-mailaren arabera</th></tr>
<tr><td><b>Klero sekularra</b>: apaizak, gotzainak eta kardinalak. <b>Fededunez</b> arduratzen ziren.<br><br><b>Klero erregularra</b>: mojeak eta fraideak. <b>Lana eta otoitzaz</b> arduratzen ziren. <b>Monasterio eta konbentuetan</b> bizi ziren.</td>
<td><b>Goi-kleroa</b>: kardinalak, gotzainak, abadeak… <b>Nobleen pribilegio berdinak</b>.<br><br><b>Behe-kleroa</b>: apaizak, fraideak, mojeak… <b>Nekazarien antzera</b> bizi ziren.</td></tr></table>
<h4>Elizaren aberastasuna</h4><p>Eliza <b>lur eta eraikin askoren jabe</b> zen. Jaurerrietan <b>errenta feudalak</b> lortzen zituen: <b>hamarrena</b> (uztaren hamarrena, %10) · etxeen <b>alokairuak</b> · <b>jaurgo-eskubideak</b> (produkzioaren zati bat) · nekazaritza-produktuen <b>salmenta</b> · eliztarren <b>dohaintzak</b> (dirutan edo lurretan).</p>
<p><b>Gizarte- eta kultura-lana</b>: <b>pobreei lagundu</b>, <b>gaixoak ospitaleetan zaindu</b>, <b>irakaskuntzaz arduratu</b>.</p>
<h4>Klero erregularra eta monasterioak</h4><p>Monasterioetan bizi ziren, <b>ordenaren arabera</b>, erregela edo arau-multzo baten menpe:</p>
<ul><li>Ordenak gizonez edo emakumez osatuta egon zitezkeen.</li><li>Monasterio bakoitzean <b>abade edo abadesa</b> batek agintzen zuen.</li><li>Onartua izateko <b>ikasi</b> behar zuten: irakurtzen eta idazten zekiten.</li>
<li><b>Botoak</b>: <b>obedientzia, pobrezia eta garbitasuna</b>.</li><li>Ordenaren arabera <b>abitua</b> jantzi behar zuten.</li><li><b>Ora et labora</b>: otoitza eta lana.</li><li>Bi ordena garrantzitsu: <b>beneditarrak eta zistertarrak</b>.</li></ul>
<div class="fig" data-svg="monasterioa"></div>
<div class="tip"><b>Trikimailuak</b>: botoak = <b>O-P-G</b> (Obedientzia, Pobrezia, Garbitasuna). Errentak = <b>H-A-J-S-D</b> («HAJ, SalDu!»: Hamarrena, Alokairuak, Jaurgo-eskubideak, Salmenta, Dohaintzak).</div>`,
  es: `<ul><li>Como la mayoría de los europeos eran <b>cristianos</b>, el clero <b>guiaba la espiritualidad</b> de los fieles y <b>organizaba la vida de la comunidad</b>.</li>
<li>El clero lo formaban las personas que <b>dedicaban su vida a la Iglesia</b>. En la cima de la <b>jerarquía</b> estaba el <b>papa</b> (en Roma).</li></ul>
<table class="tt"><tr><th>Según su función</th><th>Según su nivel de vida</th></tr>
<tr><td><b>Clero secular</b>: sacerdotes, obispos y cardenales. Se ocupaban de los <b>fieles</b>.<br><br><b>Clero regular</b>: monjes, monjas y frailes. Se dedicaban al <b>trabajo y la oración</b>. Vivían en <b>monasterios y conventos</b>.</td>
<td><b>Alto clero</b>: cardenales, obispos, abades… <b>Los mismos privilegios que los nobles</b>.<br><br><b>Bajo clero</b>: sacerdotes, frailes, monjas… Vivían <b>como los campesinos</b>.</td></tr></table>
<h4>La riqueza de la Iglesia</h4><p>La Iglesia era <b>dueña de muchas tierras y edificios</b>. En los señoríos obtenía <b>rentas feudales</b>: el <b>diezmo</b> (hamarrena, la décima parte de la cosecha, 10 %) · los <b>alquileres</b> de casas · los <b>derechos señoriales</b> (parte de la producción) · la <b>venta</b> de productos agrícolas · las <b>donaciones</b> de los fieles (en dinero o tierras).</p>
<p><b>Labor social y cultural</b>: <b>ayudar a los pobres</b>, <b>cuidar a los enfermos en hospitales</b>, <b>ocuparse de la enseñanza</b>.</p>
<h4>El clero regular y los monasterios</h4><p>Vivían en monasterios, <b>según su orden</b>, bajo una regla o conjunto de normas:</p>
<ul><li>Las órdenes podían ser de hombres o de mujeres.</li><li>En cada monasterio mandaba un <b>abad o una abadesa</b>.</li><li>Para ser admitidos tenían que <b>estudiar</b>: sabían leer y escribir.</li>
<li><b>Votos</b>: <b>obediencia, pobreza y castidad</b> (garbitasuna).</li><li>Vestían el <b>hábito</b> de su orden.</li><li><b>Ora et labora</b>: oración y trabajo.</li><li>Dos órdenes importantes: <b>benedictinos y cistercienses</b>.</li></ul>
<div class="fig" data-svg="monasterioa"></div>
<div class="tip"><b>Trucos</b>: votos = <b>O-P-G</b> (Obedientzia, Pobrezia, Garbitasuna). Rentas = <b>H-A-J-S-D</b> (Hamarrena diezmo, Alokairuak alquileres, Jaurgo-eskubideak derechos señoriales, Salmenta venta, Dohaintzak donaciones).</div>` },

{ id: 'nekazariak', ic: '🌾', t: { eu: '6. Nekazariak', es: '6. Los campesinos' },
  eu: `<ul><li>Nekazariak <b>herriaren gehiengoa</b> ziren eta <b>lan asko</b> egiten zuten.</li><li><b>Bizimodu monotonoa</b>: <b>urtaroen erritmoan</b> lantzen zuten lurra.</li>
<li>Familia guztia nekazaritza-lanetan aritzen zen.</li></ul>
<table class="tt"><tr><th>Gizonak</th><th>Emakumeak</th></tr><tr><td><b>Indar fisiko handiena</b> eskatzen zuten lanak: lurra irauli, segatu, zuhaitzak moztu…</td><td><b>Uzta-lanak</b>, <b>mahats-bilketa</b> eta <b>etxeko hegaztiez</b> arduratu.</td></tr></table>
<p><b>Teknikak eta tresnak oinarrizkoak</b> zirenez → <b>uztak oso txikiak</b> → <b>pobrezian</b> bizi ziren eta askotan <b>goseteak</b> jasaten zituzten.</p>
<div class="fig"><img data-img="jopuak" alt="Nekazariak uzta biltzen, jaunaren zaintzaile baten aginduetara (miniatura)"><span class="cap">Jopuak uzta biltzen, jaunaren zaintzailea makilarekin: joputza.</span></div>`,
  es: `<ul><li>Los campesinos eran <b>la mayoría de la población</b> y <b>trabajaban mucho</b>.</li><li><b>Vida monótona</b>: cultivaban la tierra <b>al ritmo de las estaciones</b>.</li>
<li>Toda la familia trabajaba en el campo.</li></ul>
<table class="tt"><tr><th>Hombres</th><th>Mujeres</th></tr><tr><td>Trabajos de <b>mayor fuerza física</b>: arar la tierra, segar, cortar árboles…</td><td><b>Cosecha</b>, <b>vendimia</b> y cuidado de las <b>aves de corral</b>.</td></tr></table>
<p>Como las <b>técnicas y herramientas eran básicas</b> → <b>cosechas muy pequeñas</b> → vivían en la <b>pobreza</b> y a menudo sufrían <b>hambrunas</b>.</p>
<div class="fig"><img data-img="jopuak" alt="Campesinos cosechando bajo las órdenes de un capataz del señor (miniatura)"><span class="cap">Siervos cosechando, con el capataz del señor y su vara: la servidumbre.</span></div>` },

{ id: 'feudoak', ic: '🗺️', t: { eu: '7. Feudoak', es: '7. Los feudos' },
  eu: `<div class="def"><b>Feudoa</b>: monarka edo noble batek basailu bati emandako lurrak. Basailua <b>jaun feudal</b> bihurtzen zen: feudoaren <b>errentetatik</b> bizi zen eta <b>nekazarien gaineko kontrola</b> zuen.</div>
<p>Feudoa <b>lotetsia</b> zen, <b>ez jabetza pribatua</b>: lurrak <b>ezin ziren saldu</b>, baina jaunak <b>etekinak ateratzeko</b> eta <b>ondorengoei oinordetzan emateko</b> eskubidea zuen.</p>
<h4>Jaurgo-sistema</h4><p>Nekazariak <b>babestearen truke</b>, jaunak eskubideak bereganatzen zituen:</p>
<ul><li><b>Ekonomikoak</b> → nekazariek <b>errenta</b> ordaindu behar zuten lurrak lantzearen truke.</li><li><b>Juridikoak</b> → jaunak feudoan <b>arauak eta zergak inposatzeko</b> eskubidea zuen.</li></ul>
<h4>Bi nekazari mota (herrixketan bizi ziren)</h4>
<div class="two"><div class="box"><b>Nekazari askeak</b>: <b>alodioen</b> edo beren lurren jabe; ez zeuden jabe bati lotuta. <b>Erabakiak hartzeko aske</b>: ezkondu, feudotik alde egin, lanbidea izan…</div>
<div class="box"><b>Jopuak</b>: <b>jaunaren lurrak</b> lantzen zituzten eta <b>ez zuten askatasunik</b>. Jaunaren baimenik gabe <b>ezin zituzten lurrak utzi, ezin ziren ezkondu eta ezin zuten oinordetzarik utzi</b>.</div></div>
<h4>Hiru lursail mota</h4><ul><li><b>Jaunaren erreserba</b> → lur onenak, jaunak zuzenean ustiatzeko.</li><li><b>Mantsoak</b> → nekazariek lantzeko lurrak, errenta baten truke.</li><li><b>Alodioak</b> → lursail txikiak, herri-basoak, herri-belardiak: herritarrenak.</li></ul>
<div class="fig" data-svg="feudoa"></div>
<p class="small">Gainera: <b>errota</b> (nekazariek jaunari ordaindu behar zioten erabiltzeko) · <b>ordainlekua</b> (zubia salgaiekin zeharkatzeagatik ordaintzen zen) · <b>jaunaren basoak</b> (nekazariek egur pixka bat soilik har zezaketen) · <b>gaztelua</b> (jaunaren egoitza).</p>
<h4>Nola lantzen zituzten lurrak?</h4><ul><li><b>Bi edo hiru urtean behingo txandakatzea</b> → lurrak ez agortzeko laboreak txandakatzen zituzten; zati batek atseden hartzen zuen (<b>lugorria</b>).</li>
<li><b>Iraupeneko nekazaritza</b> → lortzen zutena <b>autokontsumorako</b> zen.</li><li>Ohikoak: <b>zerealak, lekaleak, mahatsondoak, olibondoak eta fruta-arbolak</b>.</li></ul>
<p><b>Ondorioak</b>: uzta txarrak eta klima-aldaketak → <b>elikadura urritasuna</b>; elikadura txarra, higiene falta eta goseteak → <b>heriotza-tasa altuak</b>.</p>
<div class="tip"><b>Trikimailua · E-M-A</b>: lursailak = <b>E</b>rreserba (jaunarena, onenak) · <b>M</b>antsoak (nekazariek, errentaren truke) · <b>A</b>lodioak (herritarrenak).</div>`,
  es: `<div class="def"><b>Feudo</b> (feudoa): las tierras que un monarca o un noble daba a un vasallo. El vasallo se convertía en <b>señor feudal</b>: vivía de las <b>rentas</b> del feudo y tenía el <b>control sobre los campesinos</b>.</div>
<p>El feudo era <b>vinculado</b> (lotetsia), <b>no propiedad privada</b>: las tierras <b>no se podían vender</b>, pero el señor tenía derecho a <b>sacar beneficios</b> y a <b>dejarlo en herencia a sus descendientes</b>.</p>
<h4>El régimen señorial (jaurgo-sistema)</h4><p><b>A cambio de proteger</b> a los campesinos, el señor se apropiaba de derechos:</p>
<ul><li><b>Económicos</b> → los campesinos pagaban una <b>renta</b> a cambio de cultivar las tierras.</li><li><b>Jurídicos</b> → el señor tenía derecho a <b>imponer normas e impuestos</b> en el feudo.</li></ul>
<h4>Dos tipos de campesinos (vivían en aldeas)</h4>
<div class="two"><div class="box"><b>Campesinos libres</b> (nekazari askeak): dueños de <b>alodios</b> o de sus tierras; no estaban atados a un señor. <b>Libres para decidir</b>: casarse, irse del feudo, tener un oficio…</div>
<div class="box"><b>Siervos</b> (jopuak): cultivaban las <b>tierras del señor</b> y <b>no tenían libertad</b>. Sin permiso del señor <b>no podían dejar las tierras, ni casarse, ni dejar herencia</b>.</div></div>
<h4>Tres tipos de tierras</h4><ul><li><b>Reserva señorial</b> (jaunaren erreserba) → las mejores tierras, explotadas directamente por el señor.</li><li><b>Mansos</b> (mantsoak) → tierras que cultivaban los campesinos a cambio de una renta.</li><li><b>Alodios</b> (alodioak) → parcelas pequeñas, bosques y prados comunales: de los vecinos.</li></ul>
<div class="fig" data-svg="feudoa"></div>
<p class="small">Además: el <b>molino</b> (los campesinos pagaban al señor por usarlo) · el <b>portazgo</b> (se pagaba por cruzar el puente con mercancías) · los <b>bosques del señor</b> (los campesinos solo podían coger un poco de leña) · el <b>castillo</b> (residencia del señor).</p>
<h4>¿Cómo cultivaban la tierra?</h4><ul><li><b>Rotación bienal o trienal</b> → para no agotar la tierra rotaban los cultivos; una parte descansaba (<b>barbecho</b>, lugorria).</li>
<li><b>Agricultura de subsistencia</b> → lo que obtenían era para el <b>autoconsumo</b>.</li><li>Habituales: <b>cereales, legumbres, viñas, olivos y frutales</b>.</li></ul>
<p><b>Consecuencias</b>: malas cosechas y cambios del clima → <b>escasez de alimentos</b>; mala alimentación, falta de higiene y hambrunas → <b>altas tasas de mortalidad</b>.</p>
<div class="tip"><b>Truco · E-M-A</b>: tierras = <b>E</b>rreserba (del señor, las mejores) · <b>M</b>antsoak (de los campesinos, a cambio de renta) · <b>A</b>lodioak (comunales).</div>` },

{ id: 'erromanikoa', ic: '🏛️', t: { eu: '8. Arte erromanikoa', es: '8. El arte románico' },
  eu: `<div class="def"><b>XI.–XIII. mendeen</b> artean garatu zen. Inbasioak gelditu ziren eta <b>beneditarren ordenari esker</b> <b>azkar hedatu zen Europan</b> zehar.</div>
<div class="fig" data-svg="hedapena"></div>
<h4>Arkitektura: elizak eta monasterioak (5)</h4><ul><li><b>Latindar gurutzeko oinplanta</b></li><li><b>Burualdea edo absidea</b></li><li><b>Kanoi-ganga</b></li><li><b>Kontrahormak</b></li><li><b>Kanpaidorrea</b></li></ul>
<div class="fig" data-svg="eliza"></div>
<h4>Pintura eta eskultura (5)</h4><div class="two"><ul><li><b>Helburu didaktikoa</b>: herritarrei kristautasuna eta morala irakastea (gehienak <b>analfabetoak</b> ziren).</li><li><b>Horror vacui</b>: elementu asko espazio txikian.</li><li><b>Frontaltasuna</b></li><li><b>Dinamismo eza</b></li><li><b>Kolore biziak</b></li></ul>
<div class="fig small"><img data-img="pantokratorea" alt="Pantokratorea, horma-pintura erromanikoa (Taüll, XII. mendea)"><span class="cap">Pantokratorea (Taüll, 1123): frontala, kolore biziak, mugimendurik gabe.</span></div></div>
<div class="tip"><b>Trikimailuak</b>: arkitektura = <b>«LA + 3 K»</b>: <b>L</b>atindar gurutzea, <b>A</b>bsidea + <b>K</b>anoi-ganga, <b>K</b>ontrahormak, <b>K</b>anpaidorrea. Pintura/eskultura = <b>H-H-F-D-K</b>: Helburu didaktikoa, Horror vacui, Frontaltasuna, Dinamismo eza, Kolore biziak.</div>`,
  es: `<div class="def">Se desarrolló entre los <b>siglos XI y XIII</b>. Las invasiones se detuvieron y, <b>gracias a la orden benedictina</b>, <b>se extendió rápidamente por Europa</b>.</div>
<div class="fig" data-svg="hedapena"></div>
<h4>Arquitectura: iglesias y monasterios (5)</h4><ul><li><b>Planta de cruz latina</b> (latindar gurutzeko oinplanta)</li><li><b>Cabecera o ábside</b> (burualdea edo absidea)</li><li><b>Bóveda de cañón</b> (kanoi-ganga)</li><li><b>Contrafuertes</b> (kontrahormak)</li><li><b>Campanario</b> (kanpaidorrea)</li></ul>
<div class="fig" data-svg="eliza"></div>
<h4>Pintura y escultura (5)</h4><div class="two"><ul><li><b>Finalidad didáctica</b>: enseñar el cristianismo y la moral al pueblo (la mayoría eran <b>analfabetos</b>).</li><li><b>Horror vacui</b>: muchos elementos en poco espacio.</li><li><b>Frontalidad</b></li><li><b>Falta de dinamismo</b></li><li><b>Colores vivos</b></li></ul>
<div class="fig small"><img data-img="pantokratorea" alt="Pantocrátor, pintura mural románica (Taüll, siglo XII)"><span class="cap">Pantocrátor (Taüll, 1123): frontal, colores vivos, sin movimiento.</span></div></div>
<div class="tip"><b>Trucos</b>: arquitectura = <b>«LA + 3 K»</b>: <b>L</b>atindar gurutzea, <b>A</b>bsidea + <b>K</b>anoi-ganga, <b>K</b>ontrahormak, <b>K</b>anpaidorrea. Pintura/escultura = <b>H-H-F-D-K</b>: Helburu didaktikoa, Horror vacui, Frontaltasuna, Dinamismo eza, Kolore biziak.</div>` },

{ id: 'azterketa', ic: '📝', t: { eu: '10. Azterketa aurretik', es: '10. Antes del examen' },
  eu: `<h4>Azterketa nolakoa izan daiteke</h4><p>Islamari buruzko azterketak 5 galdera zituen (2 puntu bakoitza): <b>zerrenda bat</b>, <b>piramidea marraztu eta maila bakoitza azaldu</b>, <b>6 definizio</b>, <b>10 egia/gezurra</b> (+0,2 / −0,2 / 0 zuriz) eta <b>2 mapa edo irudi azaldu</b>. Simulakroak formatu hori erabiltzen du.</p>
<h4>Ortografia (lehenengo 2 akatsak doan, gero −0,1 bakoitza)</h4><p>Kontuz hauekin: basailu<b>tz</b>a · jopu<b>tz</b>a · lote<b>ts</b>ia · man<b>ts</b>oak · <b>K</b>leroa · <b>z</b>ister<b>t</b>arrak · bene<b>d</b>itarrak · i<b>nb</b>estidura · kontraho<b>r</b>mak · kanpaido<b>rr</b>ea · lugo<b>rr</b>ia · oturun<b>tz</b>ak · Erroma, Europa (letra larriz). Zure <b>f</b>-a <b>g</b> dirudi: <b>f</b>eudoa, <b>f</b>eudalismoa, <b>f</b>raideak, <b>f</b>rontaltasuna, <b>f</b>ededunak.</p>
<h4>Entregatu aurretik</h4><ul class="chk"><li>Galdera guztiak erantzun ditut (zuriz ezer ez; zerbait idatzi beti).</li><li>Zerrendetan elementu <b>guztiak</b> idatzi ditut (kontatu!).</li><li>Definizioetan irakaslearen <b>hitz zehatza</b> erabili dut.</li><li>Piramidean maila guztiak eta <b>pribilegiatuak / ez-pribilegiatuak</b> jarri ditut.</li><li>Irudietan: zer den + nor + noiz + zer gertatzen den.</li><li>E/G: esaldi <b>osoa</b> irakurri dut (azken zatia ere); ez badakit, zuriz.</li><li>Ortografia: tz/ts/z, K, letra larriak, f.</li></ul>`,
  es: `<h4>Cómo puede ser el examen</h4><p>El examen del Islam tenía 5 preguntas (2 puntos cada una): <b>una lista</b>, <b>dibujar la pirámide y explicar cada nivel</b>, <b>6 definiciones</b>, <b>10 verdadero/falso</b> (+0,2 / −0,2 / 0 en blanco) y <b>explicar 2 mapas o imágenes</b>. El simulacro usa ese formato.</p>
<h4>Ortografía (las 2 primeras faltas gratis, luego −0,1 cada una)</h4><p>Cuidado con: basailu<b>tz</b>a · jopu<b>tz</b>a · lote<b>ts</b>ia · man<b>ts</b>oak · <b>K</b>leroa · <b>z</b>ister<b>t</b>arrak · bene<b>d</b>itarrak · i<b>nb</b>estidura · kontraho<b>r</b>mak · kanpaido<b>rr</b>ea · lugo<b>rr</b>ia · oturun<b>tz</b>ak · Erroma, Europa (con mayúscula). Tu <b>f</b> parece una <b>g</b>: <b>f</b>eudoa, <b>f</b>eudalismoa, <b>f</b>raideak, <b>f</b>rontaltasuna, <b>f</b>ededunak.</p>
<h4>Antes de entregar</h4><ul class="chk"><li>He contestado todas las preguntas (nada en blanco; escribir siempre algo).</li><li>En las listas he escrito <b>todos</b> los elementos (¡cuéntalos!).</li><li>En las definiciones he usado la <b>palabra exacta</b> del profesor.</li><li>En la pirámide he puesto todos los niveles y <b>privilegiados / no privilegiados</b>.</li><li>En las imágenes: qué es + quién + cuándo + qué pasa.</li><li>V/F: he leído la frase <b>entera</b> (también el final); si no lo sé, en blanco.</li><li>Ortografía: tz/ts/z, K, mayúsculas, f.</li></ul>` }
];

  'Basailutza monarkaren eta nobleen artean edo nobleen artean egiten zen: basailuak leialtasuna, aholkua eta laguntza militarra ematen zituen eta jaunak babesa eta feudoa. Joputza jaunaren eta nekazarien artean zen: nekazariak askatasuna galdu, jaunaren lurrak landu eta uztaren zati bat ematen zuen; jaunak babesa eta lur zati bat ematen zion. Basailutzak zeremonia zuen (jauspena eta inbestidura).',
  'El vasallaje se hacía entre el monarca y los nobles o entre nobles: el vasallo daba fidelidad, consejo y ayuda militar y el señor protección y feudo. La servidumbre era entre el señor y los campesinos: el campesino perdía la libertad, cultivaba las tierras del señor y le daba parte de la cosecha; el señor le daba protección y un trozo de tierra. El vasallaje tenía ceremonia (homenaje e investidura).',
  [K('basailutza: nobleen artean / monarka', 'vasallaje: entre nobles / monarca', 'noble|monark'), K('joputza: nekazariak', 'servidumbre: campesinos', 'nekazari'), K('leialtasuna eta laguntza militarra', 'fidelidad y ayuda militar', 'leial|milita'), K('feudoa', 'feudo', 'feudo'), K('askatasuna galdu', 'pierden la libertad', 'askatasun'), K('uztaren zati bat', 'parte de la cosecha', 'uzta'), K('babesa', 'protección', 'babes')]),
W('w4', '(4. ariketa) Norentzat zen onuragarria estamentuzko gizartea? Zergatik?', '(Ejercicio 4) ¿Para quién era beneficiosa la sociedad estamental? ¿Por qué?',
  'Pribilegiatuentzat zen onuragarria: monarka, noblezia eta kleroa. Biztanleriaren gutxiengoa izan arren, eskubide guztiak zituzten: lur gehienak, ez zuten lan egiten (lurren errentetatik bizi ziren), ez zuten zergarik ordaintzen eta goi-karguak betetzen zituzten. Ez-pribilegiatuek, berriz, lan egin, beste bi estamentuak mantendu eta zerga handiak ordaindu behar zituzten, eskubiderik gabe.',
  'Era beneficiosa para los privilegiados: monarca, nobleza y clero. Aunque eran la minoría, tenían todos los derechos: la mayoría de las tierras, no trabajaban (vivían de rentas), no pagaban impuestos y ocupaban los altos cargos. Los no privilegiados, en cambio, debían trabajar, mantener a los otros dos estamentos y pagar grandes impuestos, sin derechos.',
  [K('pribilegiatuentzat', 'para los privilegiados', 'pribilegiatu'), K('monarka, noblezia, kleroa', 'monarca, nobleza, clero', 'noble|kleroa|monark'), K('lur gehienak', 'la mayoría de las tierras', 'lur'), K('zergarik ez', 'sin impuestos', 'zerg'), K('ez-pribilegiatuek lan egin eta mantendu', 'los no privilegiados trabajan y mantienen', 'lan|manten'), K('gutxiengoa / eskubideak', 'minoría / derechos', 'gutxiengo|eskubide')]),
W('w5', '(5. ariketa) Zer funtzio zuen erregeak gizarte feudalean?', '(Ejercicio 5) ¿Qué función tenía el rey en la sociedad feudal?',
  'Erregeak izaera sakratua zuen: Jainkoak hautatua zela uste zen, Lurrean gizartea antolatzeko eta kristautasuna defendatzeko. Bere erresuma gobernatzen zuen noblezia eta kleroarekin batera, Errege Kontseiluaren laguntzarekin. Haren eskumenak kanpaina militarrak gidatzea, zergak biltzea eta auzietan epaile gorena izatea ziren.',
  'El rey tenía carácter sagrado: se creía elegido por Dios para organizar la sociedad y defender el cristianismo. Gobernaba su reino junto con la nobleza y el clero, con ayuda del Consejo Real. Sus competencias eran dirigir las campañas militares, recaudar impuestos y ser juez supremo en los juicios.',
  [K('izaera sakratua / Jainkoak hautatua', 'carácter sagrado / elegido por Dios', 'sakratu|jainko'), K('kristautasuna defendatu', 'defender el cristianismo', 'kristau'), K('noblezia eta kleroarekin gobernatu / kontseilua', 'gobernar con nobleza y clero / consejo', 'kontseilu|noblezia|kleroa'), K('kanpaina militarrak', 'campañas militares', 'kanpain|milita'), K('zergak bildu', 'recaudar impuestos', 'zerg'), K('epaile gorena', 'juez supremo', 'epaile|justizi')]),
W('w6', '(6. ariketa) Alderatu gizonen eta emakumeen lanak, nobleen eta nekazarien artean.', '(Ejercicio 6) Compara los trabajos de hombres y mujeres, entre nobles y campesinos.',
  'Noble gizonek gizartea armen bidez babesten zuten eta gerrarako trebatzen ziren; feudoa kontrolatu, justizia administratu eta zergak biltzen zituzten, eta aisialdian ehizara joaten ziren eta oturuntzak egiten zituzten. Noble emakumeak (damak) leinua betikotzeaz eta seme-alaben heziketaz arduratzen ziren; senarra hiltzean, lurren eta jauregiaren ardura hartzen zuten. Nekazari gizonek indar fisiko handiko lanak egiten zituzten: lurra irauli, segatu eta zuhaitzak moztu. Nekazari emakumeak uzta-lanetan, mahats-bilketan eta etxeko hegaztiez arduratzen ziren.',
  'Los nobles varones protegían a la sociedad con las armas y se entrenaban para la guerra; controlaban el feudo, administraban justicia y recaudaban impuestos, y en su ocio cazaban y hacían banquetes. Las nobles (damas) se ocupaban de perpetuar el linaje y educar a los hijos; al morir el marido, se encargaban de las tierras y del palacio. Los campesinos hacían los trabajos de más fuerza: arar, segar y cortar árboles. Las campesinas trabajaban en la cosecha, la vendimia y cuidaban las aves de corral.',
  [K('noble gizonak: gerra / armak', 'nobles: guerra / armas', 'gerra|arma|babes'), K('damak: leinua', 'damas: linaje', 'leinu'), K('damak: seme-alaben heziketa', 'damas: educar a los hijos', 'seme|hezi'), K('nekazari gizonak: lurra irauli, segatu', 'campesinos: arar, segar', 'irauli|segat|zuhaitz'), K('nekazari emakumeak: uzta, mahatsa', 'campesinas: cosecha, vendimia', 'uzta|mahats'), K('hegaztiak', 'aves de corral', 'hegazti')]),
W('w7', '(7. ariketa) Zergatik zuen Elizak hain funtzio garrantzitsua Erdi Aroan? Kleroko kide guztiak pribilegiatuak ziren?', '(Ejercicio 7) ¿Por qué tenía la Iglesia una función tan importante? ¿Eran privilegiados todos los miembros del clero?',
  'Europako biztanle gehienak kristauak zirenez, kleroak fededunen espiritualtasuna gidatzen zuen eta komunitatearen bizitza antolatzen zuen. Gainera, Eliza lur eta eraikin askoren jabe zen eta errenta feudalak lortzen zituen (hamarrena, alokairuak…), eta gizarte- eta kultura-lana egiten zuen: pobreei lagundu, gaixoak ospitaleetan zaindu eta irakaskuntzaz arduratu. Ez, ez ziren denak pribilegiatuak: goi-kleroak nobleen pribilegio berdinak zituen, baina behe-kleroa nekazarien antzera bizi zen.',
  'Como la mayoría de los europeos eran cristianos, el clero guiaba la espiritualidad y organizaba la vida de la comunidad. Además, la Iglesia era dueña de muchas tierras y edificios y obtenía rentas (diezmo, alquileres…), y hacía labor social y cultural: ayudar a los pobres, cuidar enfermos y ocuparse de la enseñanza. No, no todos eran privilegiados: el alto clero tenía los privilegios de los nobles, pero el bajo clero vivía como los campesinos.',
  [K('biztanle gehienak kristauak', 'la mayoría cristianos', 'kristau'), K('espiritualtasuna gidatu / komunitatea antolatu', 'guiar la espiritualidad / organizar', 'espiritual|komunitate|antola'), K('lur askoren jabe / errentak (hamarrena)', 'dueña de tierras / rentas (diezmo)', 'lur|errent|hamarren'), K('pobreak, gaixoak, irakaskuntza', 'pobres, enfermos, enseñanza', 'pobre|gaixo|irakas'), K('ez: goi-kleroa bai', 'no: el alto clero sí', 'goi'), K('behe-kleroa nekazarien antzera', 'el bajo clero como los campesinos', 'behe')]),
W('w8', '(8. ariketa) Nola lortzen zen feudo baten jaun izatea? Zer eskubide zituen jaunak bere lurretan?', '(Ejercicio 8) ¿Cómo se llegaba a ser señor de un feudo? ¿Qué derechos tenía el señor en sus tierras?',
  'Basailutza-itunaren bidez: monarka edo noble batek basailu bati lurrak (feudoa) ematen zizkion inbestiduran, leialtasunaren eta laguntza militarraren truke, eta basailua jaun feudal bihurtzen zen. Feudoa lotetsia zen: ezin zen saldu, baina etekinak atera eta ondorengoei oinordetzan utz zekiekeen. Jaurgo-sisteman, nekazariak babestearen truke, jaunak eskubide ekonomikoak zituen (nekazariek errenta ordaindu behar zuten lurrak lantzeagatik) eta juridikoak (feudoan arauak eta zergak inposatzeko eskubidea).',
  'Mediante el pacto de vasallaje: un monarca o noble daba tierras (feudo) a un vasallo en la investidura, a cambio de fidelidad y ayuda militar, y el vasallo se convertía en señor feudal. El feudo era vinculado: no se podía vender, pero se podían sacar beneficios y dejarlo en herencia. En el régimen señorial, a cambio de proteger a los campesinos, el señor tenía derechos económicos (los campesinos pagaban renta por cultivar) y jurídicos (imponer normas e impuestos en el feudo).',
  [K('basailutza / inbestidura', 'vasallaje / investidura', 'basailu|inbestidur'), K('monarkak edo nobleak lurrak eman', 'el monarca o noble da tierras', 'eman|jaso'), K('leialtasunaren truke', 'a cambio de fidelidad', 'leial|milita'), K('eskubide ekonomikoak: errenta', 'derechos económicos: renta', 'ekonomiko|errent'), K('eskubide juridikoak: arauak eta zergak', 'derechos jurídicos: normas e impuestos', 'juridiko|arau|zerg'), K('lotetsia / oinordetza', 'vinculado / herencia', 'lotets|oinordet|saldu')]),
W('w9', '(9. ariketa) Zer bi nekazari mota zeuden? Eta zeintzuk ziren haien betebeharrak?', '(Ejercicio 9) ¿Qué dos tipos de campesinos había? ¿Cuáles eran sus obligaciones?',
  'Nekazari askeak eta jopuak. Nekazari askeak alodioen edo beren lurren jabe ziren, ez zeuden jabe bati lotuta eta erabakiak hartzeko aske ziren (ezkondu, feudotik alde egin, lanbidea izan). Jopuek jaunaren lurrak lantzen zituzten eta ez zuten askatasunik: jaunaren baimenik gabe ezin zituzten lurrak utzi, ezin ziren ezkondu eta ezin zuten oinordetzarik utzi. Betebeharrak: jaunari errenta ordaindu (uztaren zati bat), erreserba landu, errota eta zubia erabiltzeagatik ordaindu eta jaunaren justiziaren mende egon.',
  'Campesinos libres y siervos. Los libres eran dueños de alodios o de sus tierras, no estaban atados a un señor y eran libres para decidir (casarse, irse, tener oficio). Los siervos cultivaban las tierras del señor y no tenían libertad: sin permiso del señor no podían dejar las tierras, casarse ni dejar herencia. Obligaciones: pagar renta al señor (parte de la cosecha), cultivar la reserva, pagar por el molino y el puente y estar bajo la justicia del señor.',
  [K('nekazari askeak', 'campesinos libres', 'aske'), K('jopuak', 'siervos', 'jopu'), K('alodioen jabe', 'dueños de alodios', 'alodio'), K('askatasunik ez', 'sin libertad', 'askatasun'), K('ezin ezkondu / lurrak utzi / oinordetza', 'no podían casarse / irse / heredar', 'ezkon|utzi|oinordet'), K('errenta / uztaren zati bat', 'renta / parte de la cosecha', 'errent|uzta|ordain'), K('jaunaren justizia', 'justicia del señor', 'justizi')]),
W('w10', '(10. ariketa) Nekazarien heriotza-tasa nobleena baino handiagoa zen. Zergatik?', '(Ejercicio 10) La mortalidad de los campesinos era mayor que la de los nobles. ¿Por qué?',
  'Nekazariek teknika eta tresna oinarrizkoak zituztenez, uztak oso txikiak ziren, eta uzta txarrek eta klima-aldaketek elikadura urritasuna eragiten zuten. Pobrezian bizi ziren eta lan asko egiten zuten; elikadura txarrak, higiene faltak eta goseteek heriotza-tasa altuak eragiten zituzten. Nobleek, aldiz, lur gehienak eta errentak zituzten, ez zuten lan egiten eta janari gehiago zuten.',
  'Como los campesinos tenían técnicas y herramientas básicas, las cosechas eran muy pequeñas, y las malas cosechas y los cambios del clima provocaban escasez. Vivían en la pobreza y trabajaban mucho; la mala alimentación, la falta de higiene y las hambrunas causaban altas tasas de mortalidad. Los nobles, en cambio, tenían la mayoría de las tierras y rentas, no trabajaban y tenían más comida.',
  [K('teknika eta tresna oinarrizkoak', 'técnicas y herramientas básicas', 'tekni|tresn'), K('uzta txikiak / txarrak', 'cosechas pequeñas / malas', 'uzta'), K('elikadura txarra / urritasuna', 'mala alimentación / escasez', 'elikadur'), K('higiene falta', 'falta de higiene', 'higien'), K('goseteak', 'hambrunas', 'gose'), K('pobrezia / nobleek janari gehiago', 'pobreza / los nobles más comida', 'pobrezi|noble')]),
W('w11', 'Azaldu nola sortu zen feudalismoa (kausak eta ondorioak).', 'Explica cómo surgió el feudalismo (causas y consecuencias).',
  'IX. eta X. mendeetan inbasioen bigarren bolada gertatu zen: bikingoak iparraldetik, musulmanak hegoaldetik eta magiarrak ekialdetik. Erasoen ondorioz (lapurretak, herrixken suntsiketak, zubi- eta bide-mozketak) Europa hondatu eta zatikatu zen eta beldurra zabaldu zen. Monarkek ezin izan zioten aurre egin eta boterearen zati bat nobleei eman zieten. Nobleek armada pribatuak antolatu eta monarkaren basailu bihurtu ziren; leialtasunaren eta laguntza militarraren truke feudoa jaso eta jaun feudal bihurtu ziren. Nekazariek babes bila nobleengana jo zuten eta jopu bihurtu ziren.',
  'En los siglos IX y X hubo una segunda oleada de invasiones: vikingos del norte, musulmanes del sur y magiares del este. Por los ataques (saqueos, aldeas destruidas, puentes y caminos cortados) Europa se arruinó y se fragmentó y se extendió el miedo. Los monarcas no pudieron hacerles frente y cedieron parte de su poder a los nobles. Los nobles organizaron ejércitos privados y se hicieron vasallos del monarca; a cambio de fidelidad y ayuda militar recibieron un feudo y se convirtieron en señores feudales. Los campesinos buscaron protección en los nobles y se hicieron siervos.',
  [K('inbasioak (bigarren bolada)', 'invasiones (segunda oleada)', 'inbasio'), K('bikingoak, musulmanak, magiarrak', 'vikingos, musulmanes, magiares', 'biking|musulman|magiar'), K('Europa hondatu / beldurra', 'Europa arruinada / miedo', 'hondat|zatikat|beldur'), K('monarkek boterea nobleei', 'los monarcas ceden poder a los nobles', 'botere'), K('nobleak basailu / feudoa', 'nobles vasallos / feudo', 'basailu|feudo'), K('nekazariak jopu', 'campesinos siervos', 'jopu|babes')]),
W('w12', 'Azaldu gizarte feudala: nola zegoen antolatuta eta zer talde zeuden.', 'Explica la sociedad feudal: cómo estaba organizada y qué grupos había.',
  'Gizartea estamentuetan antolatuta zegoen; estamentu bakoitza talde itxia zen: jaiotzez batekoa zinen eta bizitza osorako. Legea eta justizia ez ziren berdinak denentzat. Bi talde zeuden: pribilegiatuak (monarka, noblezia eta kleroa), gutxiengoa, eskubide guztiekin (lur gehienak, lanik eta zergarik ez, goi-karguak); eta ez-pribilegiatuak edo hirugarren estamentua (nekazariak, artisauak, merkatariak…), gehiengoa, eskubiderik gabe eta betebeharrekin: lan egin, beste bi estamentuak mantendu eta zerga handiak ordaindu.',
  'La sociedad estaba organizada en estamentos; cada uno era un grupo cerrado: se pertenecía por nacimiento y para toda la vida. La ley y la justicia no eran iguales para todos. Había dos grupos: los privilegiados (monarca, nobleza y clero), minoría con todos los derechos (tierras, sin trabajar ni pagar impuestos, altos cargos); y los no privilegiados o tercer estado (campesinos, artesanos, mercaderes…), mayoría sin derechos y con obligaciones: trabajar, mantener a los otros dos y pagar grandes impuestos.',
  [K('estamentuak', 'estamentos', 'estamentu'), K('talde itxiak / jaiotzez', 'grupos cerrados / por nacimiento', 'itxi|jaiotz'), K('legea ez berdina', 'ley no igual', 'lege|justizi'), K('pribilegiatuak: monarka, noblezia, kleroa', 'privilegiados: monarca, nobleza, clero', 'pribilegiatu'), K('eskubideak', 'derechos', 'eskubide'), K('ez-pribilegiatuak: nekazariak, artisauak, merkatariak', 'no privilegiados: campesinos, artesanos, mercaderes', 'nekazari|artisau|merkatari'), K('betebeharrak: lana, zergak', 'obligaciones: trabajo, impuestos', 'zerg|lan|manten')], { pyr: 1 }),
W('w13', 'Azaldu kleroaren bi sailkapenak.', 'Explica las dos clasificaciones del clero.',
  'Arduraren arabera: klero sekularra (apaizak, gotzainak eta kardinalak), fededunez arduratzen zena, eta klero erregularra (mojeak eta fraideak), lana eta otoitzaz arduratzen zena eta monasterio eta konbentuetan bizi zena. Bizi-mailaren arabera: goi-kleroa (kardinalak, gotzainak, abadeak), nobleen pribilegio berdinekin, eta behe-kleroa (apaizak, fraideak, mojeak), nekazarien antzera bizi zena.',
  'Según la función: clero secular (sacerdotes, obispos y cardenales), que se ocupaba de los fieles, y clero regular (monjes y frailes), que se dedicaba al trabajo y la oración y vivía en monasterios y conventos. Según el nivel de vida: alto clero (cardenales, obispos, abades), con los privilegios de los nobles, y bajo clero (sacerdotes, frailes, monjas), que vivía como los campesinos.',
  [K('arduraren arabera', 'según la función', 'ardura'), K('klero sekularra: apaizak, gotzainak…', 'secular: sacerdotes, obispos…', 'sekular'), K('klero erregularra: monjeak, monasterioak', 'regular: monjes, monasterios', 'erregular'), K('bizi-mailaren arabera', 'según el nivel de vida', 'bizi maila|bizi-maila|bizimaila'), K('goi-kleroa: nobleen pribilegioak', 'alto: privilegios de nobles', 'goi'), K('behe-kleroa: nekazarien antzera', 'bajo: como campesinos', 'behe')]),
W('w14', 'Zer zen feudoa eta nola banatzen ziren bere lurrak?', '¿Qué era el feudo y cómo se repartían sus tierras?',
  'Feudoa monarka edo noble batek basailu bati emandako lurrek osatzen zuten. Lotetsia zen: ezin zen saldu, baina jaunak etekinak atera eta oinordetzan utz zezakeen. Hiru lursail mota zeuden: jaunaren erreserba (lur onenak, jaunak zuzenean ustiatzeko), mantsoak (nekazariek lantzeko lurrak, errenta baten truke) eta alodioak (lursail txikiak, herri-basoak eta herri-belardiak, herritarrenak). Gainera gaztelua, errota, ordainlekua, eliza eta herrixka zeuden.',
  'El feudo lo formaban las tierras que un monarca o noble daba a un vasallo. Era vinculado: no se podía vender, pero el señor podía sacar beneficios y dejarlo en herencia. Había tres tipos de tierras: la reserva señorial (las mejores, explotadas por el señor), los mansos (cultivados por los campesinos a cambio de renta) y los alodios (parcelas pequeñas, bosques y prados comunales). Además había castillo, molino, portazgo, iglesia y aldea.',
  [K('basailu bati emandako lurrak', 'tierras dadas a un vasallo', 'basailu|eman'), K('lotetsia / ezin saldu', 'vinculado / no vender', 'lotets|saldu'), K('erreserba: lur onenak', 'reserva: las mejores tierras', 'erreserb'), K('mantsoak: errenta', 'mansos: renta', 'mants'), K('alodioak: herritarrenak', 'alodios: comunales', 'alodio')]),
W('w15', 'Azaldu arte erromanikoa: noiz, nola hedatu zen eta zer ezaugarri dituen.', 'Explica el arte románico: cuándo, cómo se extendió y qué características tiene.',
  'Arte erromanikoa XI. eta XIII. mendeen artean garatu zen. Inbasioak gelditu zirenean, beneditarren ordenari esker Europan zehar azkar hedatu zen. Arkitekturan, elizek eta monasterioek latindar gurutzeko oinplanta, burualdea edo absidea, kanoi-ganga, kontrahormak eta kanpaidorrea dituzte. Pinturak eta eskulturak helburu didaktikoa zuten (herritarrak analfabetoak ziren), horror vacui, frontaltasuna, dinamismo eza eta kolore biziak.',
  'El arte románico se desarrolló entre los siglos XI y XIII. Cuando cesaron las invasiones, se extendió rápidamente por Europa gracias a la orden benedictina. En arquitectura, iglesias y monasterios tienen planta de cruz latina, cabecera o ábside, bóveda de cañón, contrafuertes y campanario. La pintura y la escultura tenían finalidad didáctica (el pueblo era analfabeto), horror vacui, frontalidad, falta de dinamismo y colores vivos.',
  [K('XI.–XIII. mendeak', 'siglos XI–XIII', 'xi|xiii|hamaika'), K('beneditarrak', 'benedictinos', 'benedi'), K('latindar gurutzea / absidea', 'cruz latina / ábside', 'latindar|abside'), K('kanoi-ganga / kontrahormak', 'bóveda de cañón / contrafuertes', 'kanoi|kontrahorm'), K('helburu didaktikoa', 'finalidad didáctica', 'didakti'), K('frontaltasuna / kolore biziak / horror vacui', 'frontalidad / colores vivos / horror vacui', 'frontal|kolore|horror')]),
W('w16', 'Ikusi irudia: zer harreman agertzen da? Azaldu.', 'Mira la imagen: ¿qué relación aparece? Explícala.',
  'Irudian nekazariak uzta biltzen ari dira, jaunaren zaintzaile edo ordezkari bat makila batekin agintzen ari zaien bitartean. Joputza da: jopuek jaunaren lurrak lantzen zituzten, askatasunik gabe, eta uztaren zati bat jaunari eman behar zioten; jaunaren justiziaren mende zeuden. Horren truke jaunak babesa eta lur zati bat ematen zien.',
  'En la imagen los campesinos están cosechando mientras un capataz o representante del señor les da órdenes con una vara. Es la servidumbre: los siervos cultivaban las tierras del señor, sin libertad, y debían darle parte de la cosecha; estaban bajo su justicia. A cambio, el señor les daba protección y un trozo de tierra.',
  [K('nekazariak / jopuak', 'campesinos / siervos', 'nekazari|jopu'), K('uzta biltzen', 'cosechando', 'uzta'), K('joputza', 'servidumbre', 'joputz|jopu'), K('askatasunik ez', 'sin libertad', 'askatasun'), K('uztaren zati bat jaunari', 'parte de la cosecha al señor', 'zati|ordain|errent'), K('babesa / jaunaren lurrak', 'protección / tierras del señor', 'babes|jaun')], { img: 'jopuak' }),

/* ---------------------------------------------------------------- itemak aukeratu */
function poolFor(s, lv) {
  if (s === 'hitz') return G.TERMS.map(x => x.id);
  if (s === 'eg') { const a = G.TF.filter(x => (lv <= 2 ? x.lv === 1 : true)).map(x => x.id); return lv >= 3 ? a.concat(G.TF.filter(x => x.lv === 2).map(x => x.id)) : a; }
  if (s === 'zer') return G.LISTS.map(x => x.id);
  if (s === 'pir') return ['piramidea'];
  if (s === 'eti') return ['feudoa', 'eliza', 'monasterioa', 'inbasioak', 'hedapena'];
  if (s === 'sail') return G.SORT.map(x => x.id);
  if (s === 'kate') return G.ORDER.map(x => x.id);
  if (s === 'zuz') return G.ERRS.map(x => x.id);
  if (s === 'idaz') return G.WRITE.map(x => x.id);
  return [];
}
function choose(s, lv, avoid) {
  const pool = poolFor(s, lv).filter(id => !avoid.includes(id)); const p = pool.length ? pool : poolFor(s, lv);
  const failed = S.fails.filter(f => f.s === s).map(f => f.id);
  const w = p.map(id => (S.seen[s + ':' + id] || 0) - (failed.includes(id) ? 1.5 : 0) + Math.random() * 1.2);
  let bi = 0; w.forEach((v, i) => { if (v < w[bi]) bi = i; }); return p[bi];
}
function makeItem(s, lv, id) {
  const it = { s, lv, id };
  if (s === 'hitz') { it.d = G.TERMS.find(x => x.id === id); if (lv === 1) { const others = shuffle(G.TERMS.filter(x => x.id !== id && x.s === it.d.s).concat(shuffle(G.TERMS.filter(x => x.id !== id))).slice(0, 12)); const opts = []; others.forEach(o => { if (opts.length < 3 && !opts.includes(o.a[0])) opts.push(o.a[0]); }); it.opts = shuffle(opts.concat([it.d.a[0]])); } }
  if (s === 'eg') it.d = G.TF.find(x => x.id === id);
  if (s === 'zer') it.d = G.LISTS.find(x => x.id === id);
  if (s === 'pir' || s === 'eti') { it.d = G.LABELS[id]; const all = it.d.slots.map((_, i) => i); it.slots = s === 'pir' ? (lv === 1 ? shuffle(all).slice(0, 7).sort((a, b) => a - b) : lv === 2 ? shuffle(all).slice(0, 11).sort((a, b) => a - b) : all) : all; }
  if (s === 'sail') { it.d = G.SORT.find(x => x.id === id); it.order = shuffle(it.d.items.map((_, i) => i)); }
  if (s === 'kate') { it.d = G.ORDER.find(x => x.id === id); it.order = shuffle(it.d.steps.map((_, i) => i)); if (it.order.every((v, i) => v === i)) it.order.reverse(); }
  if (s === 'zuz') { it.d = G.ERRS.find(x => x.id === id); if (lv === 1) { const ds = shuffle(G.ERRS.filter(x => x.id !== id).map(x => x.fix[0])).slice(0, 2); it.opts = shuffle(ds.concat([it.d.fix[0]])); } }
  if (s === 'idaz') it.d = G.WRITE.find(x => x.id === id);
  return it;
}
