  h += '<details class="res"><summary>4. ' + t(EXT[3]) + '</summary><ul class="keys">' + E.q4.ids.map((id, k) => { const d = G.TF.find(x => x.id === id), r = g.R.q4.r[k]; return '<li class="' + (r === 1 ? 'y' : r === -1 ? 'n' : '') + '">' + (r === 0 ? '○ ' : '') + L(esc(d.eu), esc(d.es)) + ' → <b>' + (d.v ? 'E' : 'G') + '</b>' + (d.w ? ' <span class="small muted">' + t(d.w) + '</span>' : '') + '</li>'; }).join('') + '</ul></details>';
  const w5 = G.WRITE.find(x => x.id === E.q5.w), dl = G.LABELS[E.q5.dg];
  h += '<details class="res"><summary>5. ' + t(EXT[4]) + '</summary><p><b>a) ' + g.R.q5.k.found + ' / ' + g.R.q5.k.total + '</b></p><ul class="keys">' + w5.keys.map((k, i) => '<li class="' + (g.R.q5.k.hit[i] ? 'y' : 'n') + '">' + L(esc(k.eu), esc(k.es)) + '</li>').join('') + '</ul><div class="model">' + L(esc(w5.m.eu), esc(w5.m.es)) + '</div><p><b>b)</b></p><ul class="keys">' + dl.slots.map((s, k) => '<li class="' + (g.R.q5.m[k].ok ? 'y' : 'n') + '">' + (k + 1) + '. ' + esc(s[0]) + '</li>').join('') + '</ul></details></div>';
  h += '<div class="card"><p>' + L('Gorde segurtasun-kopia: familiak zure erantzunak eta arbela ikus ditzake.', 'Guarda una copia: la familia puede ver tus respuestas y tu pizarra.') + '</p><button class="btn ok" data-a="bk">💾 ' + L('Gorde kopia', 'Guardar copia') + '</button></div></main>';
  app.innerHTML = h; app.onclick = e => { if (e.target.closest('[data-a="bk"]')) backupSave(); };
}

/* ---------------------------------------------------------------- intsigniak */
function badges() { let h = top() + '<main><h1>' + L('Intsigniak', 'Insignias') + '</h1><p class="muted">🪙 ' + S.coins + ' · ' + L('Jarraian ondo (onena): ', 'Mejor racha de aciertos: ') + S.best + ' · 🔥 ' + S.streak.n + '</p><div class="badges">'; BADGES.forEach(([id, ic, n]) => { h += '<div class="badge' + (S.badges[id] ? ' got' : '') + '"><i>' + ic + '</i><b>' + t(n) + '</b></div>'; }); app.innerHTML = h + '</div></main>'; app.onclick = null; }

/* ---------------------------------------------------------------- familiarentzat */
let famOK = false;
function family() {
  if (!famOK) { const a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4); app.innerHTML = top() + '<main><div class="card fam" style="max-width:520px"><h1>' + L('Familiarentzat', 'Para la familia') + '</h1><p>' + L('Sartzeko: zenbat da <b>' + a + ' × ' + b + '</b>?', 'Para entrar: ¿cuánto es <b>' + a + ' × ' + b + '</b>?') + '</p><div class="row"><input type="text" inputmode="numeric" id="gate" style="width:120px"><button class="btn pri" data-a="in">' + L('Sartu', 'Entrar') + '</button></div></div></main>'; app.onclick = e => { if (e.target.closest('[data-a="in"]')) { if (+$('#gate').value === a * b) { famOK = true; family(); } else toast(L('Ez da zuzena', 'No es correcto')); } }; return; }
  const days = [...Array(10)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 9 + i); const k = today(d); return [k, S.stats.days[k] || 0]; }); const mx = Math.max(60, ...days.map(d => d[1]));
  let h = top() + '<main class="fam"><h1>' + L('Familiarentzat', 'Para la familia') + '</h1>';
  h += '<section class="card"><h2>' + L('Ezarpenak', 'Ajustes') + '</h2><div class="row"><label>' + L('Izena', 'Nombre') + ': <input type="text" id="nm" value="' + esc(S.name) + '" style="width:160px"></label><label>' + L('Azterketaren data', 'Fecha del examen') + ': <input type="date" id="ed" value="' + (S.set.examDate || '') + '"></label><button class="btn pri" data-a="setsave">' + L('Gorde', 'Guardar') + '</button></div><p class="small muted">' + L('Datarekin, eguneko plana bera antolatzen da: teoria eta ariketak lehenengo egunean, simulakroa bezperan, errepaso laburra azterketa-egunean.', 'Con la fecha, el plan diario se organiza solo: teoría y ejercicios el primer día, simulacro la víspera, repaso corto el día del examen.') + '</p></section>';
  h += '<section class="card"><h2>' + L('Ikasteko denbora (10 egun)', 'Tiempo de estudio (10 días)') + '</h2><div class="bars">' + days.map(([k, s]) => '<div style="height:' + Math.round(s / mx * 100) + '%" title="' + k + ': ' + Math.round(s / 60) + ' min"><span>' + k.slice(8) + '</span></div>').join('') + '</div><p class="small muted" style="margin-top:26px">' + L('Guztira: ', 'Total: ') + Math.round(days.reduce((a, d) => a + d[1], 0) / 60) + ' min · ' + L('Teoria irakurrita: ', 'Teoría leída: ') + G.THEORY.filter(x => S.read[x.id]).length + ' / ' + G.THEORY.length + '</p></section>';
  h += '<section class="card"><h2>' + L('Trebetasunak', 'Destrezas') + '</h2><div class="tblwrap"><table class="tt"><tr><th></th><th>' + L('Maila', 'Nivel') + '</th><th>' + L('Saiakerak', 'Intentos') + '</th><th>' + L('Asmatzea (8)', 'Acierto (8)') + '</th></tr>' + SKILLS.map(id => { const k = sk(id), a = acc(id); return '<tr><td>' + t(SK[id]) + '</td><td>' + k.lv + (k.dom ? ' ✓' : '') + '</td><td>' + k.att + '</td><td>' + (a == null ? '—' : Math.round(a * 100) + ' %') + '</td></tr>'; }).join('') + '</table></div><p class="small muted">' + L('Helburua praktikan: %60–75. Prestaketa simulakroan neurtzen da.', 'Objetivo en práctica: 60–75 %. La preparación se mide en el simulacro.') + '</p></section>';
  h += '<section class="card"><h2>' + L('Simulakroak', 'Simulacros') + '</h2>' + (S.exams.length ? '<table class="restab"><tr><th>' + L('Data', 'Fecha') + '</th><th>' + L('Nota', 'Nota') + '</th><th>' + L('Denbora', 'Tiempo') + '</th><th></th></tr>' + S.exams.slice().reverse().map(x => '<tr><td>' + new Date(x.at).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' }) + '</td><td><b>' + fmt(x.score) + '</b></td><td>' + Math.round(x.dur / 60) + ' min</td><td><button class="btn sm ghost" data-ex="' + x.at + '">' + L('Arbela ikusi', 'Ver pizarra') + '</button></td></tr>').join('') + '</table><div id="exv"></div>' : '<p class="muted">' + L('Oraindik ez du egin.', 'Aún no ha hecho ninguno.') + '</p>') + '</section>';
  const pend = S.pend.filter(p => p.v == null).slice(-12).reverse();
  h += '<section class="card"><h2>' + L('Idatzizko erantzunak berrikusteko', 'Respuestas escritas por revisar') + ' (' + S.pend.filter(p => p.v == null).length + ')</h2>' + (pend.length ? pend.map(p => { const w = G.WRITE.find(x => x.id === p.id); return '<div class="pend"><b>' + t(w.q) + '</b>' + (p.ex ? ' <span class="small">(' + L('simulakroa', 'simulacro') + ')</span>' : '') + '<p class="small muted">' + L('Gako-hitzak: ', 'Palabras clave: ') + p.found + ' / ' + p.total + '</p><div class="mine" lang="eu">' + esc(p.txt || '—') + '</div><details><summary class="small">' + L('Eredua', 'Modelo') + '</summary><div class="model">' + L(esc(w.m.eu), esc(w.m.es)) + '</div></details><div class="row" style="margin-top:6px"><button class="btn sm ok" data-pv="' + p.at + '|' + p.id + '|1">✓ ' + L('Ondo', 'Bien') + '</button><button class="btn sm ghost" data-pv="' + p.at + '|' + p.id + '|0">✗ ' + L('Osatu behar du', 'Debe completarla') + '</button></div></div>'; }).join('') : '<p class="muted">' + L('Ez dago ezer berrikusteko.', 'No hay nada por revisar.') + '</p>') + '</section>';
  h += '<section class="card"><h2>' + L('Segurtasun-kopia', 'Copia de seguridad') + '</h2><p>' + L('Azken kopia: ', 'Última copia: ') + '<b>' + (S.backupAt ? new Date(S.backupAt).toLocaleString('es-ES') : '—') + '</b>. ' + L('Fitxategi batean dago dena: mailak, simulakroak, idatzitakoak eta arbela. iPad-ean: «Gorde Fitxategietan».', 'Es un archivo con todo: niveles, simulacros, lo escrito y la pizarra. En el iPad: «Guardar en Archivos».') + '</p><div class="row"><button class="btn pri" data-a="bk">💾 ' + L('Gorde kopia', 'Guardar copia') + '</button><button class="btn ghost" data-a="rs">' + L('Kopia bat berreskuratu', 'Recuperar una copia') + '</button></div></section>';
  h += '<section class="card"><h2>' + L('Hutsetik hasi', 'Empezar de cero') + '</h2><button class="btn ghost" data-a="reset" style="color:var(--bad)">' + L('Aurrerapen guztia ezabatu', 'Borrar todo el progreso') + '</button></section></main>';
  app.innerHTML = h;
  app.onclick = e => {
    const x = e.target.closest('[data-ex]'); if (x) { showExamInk(+x.dataset.ex); return; }
    const pv = e.target.closest('[data-pv]'); if (pv) { const [at, id, v] = pv.dataset.pv.split('|'); const p = S.pend.find(q => String(q.at) === at && q.id === id); if (p) { p.v = +v; save(); family(); } return; }
    const a = e.target.closest('[data-a]'); if (!a) return; const k = a.dataset.a;
    if (k === 'setsave') { S.name = ($('#nm').value || 'Álex').trim().slice(0, 30); S.set.examDate = $('#ed').value || null; S.plan = null; save(); toast(L('Gordeta. Gaurko plana berriz kalkulatu da.', 'Guardado. El plan de hoy se ha recalculado.')); family(); }
    if (k === 'bk') backupSave();
    if (k === 'rs') backupPick(txt => { const r = restoreJSON(txt); if (r.ok) { toast(L('Kopia berreskuratuta', 'Copia recuperada')); family(); } else toast(r.m); });
    if (k === 'reset') modal('<h2>' + L('Dena ezabatu?', '¿Borrar todo?') + '</h2><p>' + L('Mailak, txanponak, simulakroak eta arbela galduko dira. Egin lehenago kopia bat.', 'Se pierden niveles, monedas, simulacros y pizarras. Haz antes una copia.') + '</p><div class="row"><button class="btn" style="background:var(--bad);color:#fff" data-m="yes">' + L('Bai, ezabatu', 'Sí, borrar') + '</button><button class="btn ghost" data-m="no">' + L('Utzi', 'Cancelar') + '</button></div>', m => { if (m === 'yes') { LS.keys().filter(k2 => k2.startsWith(INK) || k2 === KEY || k2 === EXK).forEach(k2 => LS.del(k2)); S = fresh(); save(); famOK = false; go('home'); } });
  };
}
function showExamInk(at) {
  const x = S.exams.find(e => e.at === at); if (!x) return;
  let h = '<h3 style="margin-top:12px">' + new Date(at).toLocaleString('es-ES') + ' · ' + fmt(x.score) + '</h3><div class="inkthumbs">';
  EXT.forEach((q, k) => { h += '<figure data-ink="' + at + '-' + k + '"><figcaption><b>' + t(q) + '</b> · ' + fmt(x.pts[k]) + ' / 2</figcaption></figure>'; });
  $('#exv').innerHTML = h + '</div>';
  $$('#exv [data-ink]').forEach(f => { const s = LS.get(INK + f.dataset.ink); if (s) f.appendChild(G.inkThumb(G.inkDecode(s))); else f.insertAdjacentHTML('beforeend', '<p class="small muted">' + L('(arbela hutsik)', '(pizarra vacía)') + '</p>'); });
}

/* ---------------------------------------------------------------- segurtasun-kopia */
function backupJSON() { const ink = {}; LS.keys().filter(k => k.startsWith(INK)).forEach(k => { ink[k.slice(INK.length)] = LS.get(k); }); return JSON.stringify({ app: 'gaztelua', v: 1, at: new Date().toISOString(), state: S, ink }); }
function restoreJSON(txt) {
  let o; try { o = JSON.parse(txt); } catch (e) { return { ok: false, m: L('Fitxategia ez da Gaztelua-ren kopia bat.', 'El archivo no es una copia de Gaztelua.') }; }
  if (!o || o.app !== 'gaztelua' || !o.state || o.state.v !== 1) return { ok: false, m: L('Fitxategia ez da Gaztelua-ren kopia bat.', 'El archivo no es una copia de Gaztelua.') };
  LS.keys().filter(k => k.startsWith(INK)).forEach(k => LS.del(k)); Object.entries(o.ink || {}).forEach(([k, v]) => { if (typeof v === 'string') LS.set(INK + k, v); });
  if (!LS.set(KEY, JSON.stringify(o.state))) return { ok: false, m: L('Ezin izan da gorde.', 'No se ha podido guardar.') };
  S = load(); S.welcomed = true; save(); return { ok: true };
}
const safeName = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
function backupSave() {
  const data = backupJSON(), fname = 'gaztelua-kopia-' + safeName(S.name) + '-' + today() + '.json';
  const ok = () => { S.backupAt = Date.now(); award('copia'); save(); toast('💾 ' + L('Kopia gordeta', 'Copia guardada')); };
  try { for (const type of ['application/json', 'text/plain']) { const file = new File([data], fname, { type }); if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Gaztelua' }).then(ok).catch(e => { if (!e || e.name !== 'AbortError') plain(); }); return; } } } catch (e) { /* jarraitu */ }
  plain();
  function plain() { try { const url = URL.createObjectURL(new Blob([data], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); ok(); } catch (e) { toast(L('Nabigatzaile honek ez du fitxategirik gordetzen uzten', 'Este navegador no deja guardar archivos')); } }
}
function backupPick(done) { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json,text/plain'; i.style.display = 'none'; document.body.appendChild(i); i.addEventListener('change', () => { const f = i.files && i.files[0]; i.remove(); if (!f) return; const rd = new FileReader(); rd.onload = () => done(String(rd.result || '')); rd.readAsText(f); }); i.click(); }

/* ---------------------------------------------------------------- abiarazi */
window.GZT = { S: () => S, sess: () => SESS, item: () => SESS && SESS.item, exam: () => EX, go, startSess, newExam, finishExam, gradeExam, matchTerm, checkKeys, checkList, norm, setStart: v => { if (EX) EX.start = v; }, makeItem };
if (window.GZ_PWA && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
applyLang();
const pend0 = loadExam();
go('home');
if (pend0 && !pend0.ended) setTimeout(() => toast(L('Simulakro bat amaitu gabe duzu: «Simulakroa» sakatuta jarraitu', 'Tienes un simulacro sin terminar: pulsa «Simulacro» para continuar'), 3500), 800);
})();

</script></body></html>
